[package]
name = "worldmaker-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WorldMaker application shell: eframe/egui + wgpu"

[dependencies]
worldmaker-core = { workspace = true }
worldmaker-sim = { workspace = true }
worldmaker-io = { workspace = true }
rayon = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }
eframe = { version = "0.36.1", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
flexi_logger = { version = "0.31.10", default-features = false }
pollster = "1.0.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
