[workspace]
resolver = "2"
members = [
    "crates/worldmaker-core",
    "crates/worldmaker-sim",
    "crates/worldmaker-io",
    "crates/worldmaker-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/dancyrus/WorldMaker"

[workspace.dependencies]
worldmaker-core = { path = "crates/worldmaker-core" }
worldmaker-sim = { path = "crates/worldmaker-sim" }
worldmaker-io = { path = "crates/worldmaker-io" }
rayon = "1.10"
rand = "0.8"
rand_pcg = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
anyhow = "1"
thiserror = "2"

[profile.release]
debug = true

[profile.dev.package."*"]
opt-level = 2
